aid: meniga
name: Meniga
description: >-
  Meniga is a global leader in digital banking and personal finance management
  (PFM) solutions, serving over 100 million banking customers across 30 countries
  through partnerships with major financial institutions. Meniga provides RESTful
  APIs and mobile SDKs on top of its software products so banks can enrich
  transaction data, deliver personalized finance management, cashflow forecasting,
  smart savings, sustainability/carbon insights, and agentic banking experiences
  inside their own digital channels. The platform is delivered as a white-label,
  tenant-hosted API (each bank points client SDKs at their own Meniga API URL),
  secured with OAuth 2.0 and OpenID Connect via Meniga's IdentityServer stack,
  with official first-party iOS and Android SDKs published to CocoaPods and Maven
  Central. This profile was enriched from Meniga's public developer surface
  (developer portal, GitHub organization, and published SDKs).
